<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Author Engineering — PropTech">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c12"/>
      <stop offset="0.55" stop-color="#101622"/>
      <stop offset="1" stop-color="#0a1a20"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0097B2"/>
      <stop offset="0.5" stop-color="#00B4A6"/>
      <stop offset="1" stop-color="#7fe3d6"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4A6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B4A6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00B4A6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00B4A6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00B4A6" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00B4A6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#00B4A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0097B2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0097B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridS" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5fd4c8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="gridL" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#5fd4c8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="a1"/>
      <feFlood flood-color="#00B4A6" flood-opacity="0.55" result="c1"/>
      <feComposite in="c1" in2="a1" operator="in" result="g1"/>
      <feMerge><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="26"/></clipPath>
    <style>
      .t { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .eyebrow { font-weight: 600; font-size: 14px; letter-spacing: 7px; fill: #5fd4c8; }
      .h1 { font-weight: 800; font-size: 74px; letter-spacing: 16px; fill: #f2f5f8; }
      .h2 { font-weight: 300; font-size: 30px; letter-spacing: 21px; fill: #c9d6df; }
      .sub { font-weight: 500; font-size: 17px; letter-spacing: 1.5px; fill: #8fa3b3; }
      @keyframes drift1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-50px,22px) } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,-26px) } }
      @keyframes scan { 0% { transform: translateY(-20px) } 100% { transform: translateY(380px) } }
      @keyframes draw { 0% { stroke-dashoffset: 1800 } 70%,100% { stroke-dashoffset: 0 } }
      @keyframes blink { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      @keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
      @keyframes spinR { from { transform: rotate(360deg) } to { transform: rotate(0deg) } }
      @keyframes shimmer { 0% { transform: translateX(-260px) } 100% { transform: translateX(560px) } }
      @keyframes breathe { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      .d1 { animation: drift1 12s ease-in-out infinite; }
      .d2 { animation: drift2 15s ease-in-out infinite; }
      .scan { animation: scan 7s linear infinite; }
      .draw { stroke-dasharray: 1800; animation: draw 9s ease-out infinite alternate; }
      .w1 { animation: blink 3.1s ease-in-out infinite; }
      .w2 { animation: blink 4.3s ease-in-out infinite 1.2s; }
      .w3 { animation: blink 2.6s ease-in-out infinite .6s; }
      .orb1 { transform-origin: 950px 172px; animation: spin 26s linear infinite; }
      .orb2 { transform-origin: 950px 172px; animation: spinR 40s linear infinite; }
      .shim { animation: shimmer 4.5s ease-in-out infinite; }
      .breathe { animation: breathe 4s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#gridS)"/>
    <rect width="1200" height="360" fill="url(#gridL)"/>
    <g class="d1"><circle cx="980" cy="120" r="300" fill="url(#glowA)"/></g>
    <g class="d2"><circle cx="160" cy="330" r="260" fill="url(#glowB)"/></g>

    <!-- город: каркас зданий по низу и кран справа -->
    <g fill="none" stroke="#00B4A6" stroke-opacity="0.16" stroke-width="1.2">
      <path id="sky" d="M0 360V336h40v-14h36v38 M90 360V318h30v-10h28v52 M160 360V330h52v30 M560 360V322h34v38 M600 360V300h46v60 M652 360V318h30v42 M690 360V292l26-16 26 16v68 M750 360V326h38v34 M1090 360V312h36v48 M1132 360V296h40v64 M1176 360V320h24v40"/>
      <path d="M1150 360V150 M1096 150h104 M1150 150l-20 0 M1150 162l46-12 M1110 150v26 M1150 150l10-14h4l-4 14"/>
    </g>
    <g fill="none" stroke="url(#teal)" stroke-width="1.4" class="draw" stroke-opacity="0.8">
      <path d="M0 360V336h40v-14h36v38 M90 360V318h30v-10h28v52 M160 360V330h52v30 M560 360V322h34v38 M600 360V300h46v60 M652 360V318h30v42 M690 360V292l26-16 26 16v68 M750 360V326h38v34 M1090 360V312h36v48 M1132 360V296h40v64 M1176 360V320h24v40"/>
    </g>
    <g fill="#5fd4c8">
      <rect class="w1" x="612" y="314" width="5" height="7" rx="1"/><rect class="w2" x="628" y="334" width="5" height="7" rx="1"/>
      <rect class="w3" x="704" y="306" width="5" height="7" rx="1"/><rect class="w1" x="724" y="328" width="5" height="7" rx="1"/>
      <rect class="w2" x="1144" y="312" width="5" height="7" rx="1"/><rect class="w3" x="1104" y="328" width="5" height="7" rx="1"/>
      <rect class="w1" x="102" y="330" width="5" height="7" rx="1"/><rect class="w2" x="52" y="340" width="5" height="7" rx="1"/>
    </g>
    <g class="breathe"><line x1="1110" y1="176" x2="1110" y2="206" stroke="#00B4A6" stroke-width="1.2"/><rect x="1102" y="206" width="16" height="10" fill="none" stroke="#00B4A6" stroke-width="1.2"/></g>

    <g class="scan"><rect x="0" y="0" width="1200" height="1.5" fill="url(#fadeR)" opacity="0.5"/></g>

    <!-- логотип с орбитами -->
    <g class="orb2"><circle cx="950" cy="172" r="132" fill="none" stroke="#00B4A6" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2 9"/></g>
    <g class="orb1">
      <circle cx="950" cy="172" r="112" fill="none" stroke="url(#teal)" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="120 40 18 40" filter="url(#soft)"/>
      <circle cx="1062" cy="172" r="4" fill="#7fe3d6" filter="url(#soft)"/>
    </g>
    <image x="890" y="128" width="122" height="89" href="data:image/png;base64," xlink:href="data:image/png;base64," filter="url(#glow)"/>

    <!-- текст -->
    <g class="t">
      <text x="70" y="96" class="eyebrow">PROPTECH · DIGITAL PRODUCTS</text>
      <text x="66" y="178" class="h1" filter="url(#glow)">AUTHOR</text>
      <text x="70" y="226" class="h2">ENGINEERING</text>
      <g>
        <rect x="70" y="250" width="420" height="2" fill="#1f2a36"/>
        <rect x="70" y="250" width="150" height="2" fill="url(#teal)" filter="url(#soft)"/>
        <g class="shim"><rect x="70" y="249" width="70" height="4" rx="2" fill="#7fe3d6" opacity="0.55" filter="url(#soft)"/></g>
      </g>
      <text x="70" y="290" class="sub">Цифровые продукты для девелопмента и управления недвижимостью</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="26" fill="none" stroke="url(#teal)" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
</svg>
