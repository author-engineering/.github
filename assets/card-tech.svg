<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 250" width="590" height="250" role="img" aria-label="AUTHOR TECH">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d121b"/><stop offset="1" stop-color="#0f1c24"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop offset="0" stop-color="#0097B2"/><stop offset="1" stop-color="#00B4A6"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00B4A6" stop-opacity="0.28"/><stop offset="1" stop-color="#00B4A6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#5fd4c8" stroke-opacity="0.05"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="590" height="250" rx="20"/></clipPath>
    <style>
      .t{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
      .eb{font-weight:600;font-size:12px;letter-spacing:5px;fill:#5fd4c8}
      .ti{font-weight:800;font-size:34px;letter-spacing:6px;fill:#f2f5f8}
      .tx{font-weight:400;font-size:15px;fill:#9fb1bf}
      .ch{font-weight:600;font-size:12px;letter-spacing:1px;fill:#bfe9e4}
      @keyframes g{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,18px)}}
      @keyframes p{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes bar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
      .gl{animation:g 10s ease-in-out infinite}.pu{animation:p 3s ease-in-out infinite}
      .b1,.b2,.b3,.b4{transform-box:fill-box;transform-origin:bottom;animation:bar 3.2s ease-in-out infinite}
      .b2{animation-delay:.4s}.b3{animation-delay:.8s}.b4{animation-delay:1.2s}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="590" height="250" fill="url(#bg)"/><rect width="590" height="250" fill="url(#grid)"/>
    <g class="gl"><circle cx="500" cy="40" r="180" fill="url(#glow)"/></g>
    <g transform="translate(462,64)" class="pu" fill="none" stroke="#00B4A6" stroke-width="1.6"><rect x="0" y="0" width="38" height="38" rx="8"/><rect x="48" y="0" width="38" height="38" rx="8" stroke-opacity=".6"/><rect x="0" y="48" width="38" height="38" rx="8" stroke-opacity=".6"/><rect x="48" y="48" width="38" height="38" rx="8"/><circle cx="19" cy="19" r="5" fill="#00B4A6" stroke="none"/></g>
    <g class="t">
      <text x="34" y="52" class="eb">PLATFORM</text>
      <text x="32" y="98" class="ti">AUTHOR TECH</text>
      <rect x="34" y="114" width="64" height="2" fill="url(#teal)" filter="url(#soft)"/>
      <text x="34" y="148" class="tx">Платформа для управления девелоперской</text>
      <text x="34" y="172" class="tx">компанией: проекты, документы, процессы.</text>
      <rect x="34" y="196" width="79" height="26" rx="13" fill="#00B4A6" fill-opacity="0.08" stroke="#00B4A6" stroke-opacity="0.45"/><text x="73.5" y="213.5" text-anchor="middle" class="ch">Проекты</text>
      <rect x="123" y="196" width="94" height="26" rx="13" fill="#00B4A6" fill-opacity="0.08" stroke="#00B4A6" stroke-opacity="0.45"/><text x="170.0" y="213.5" text-anchor="middle" class="ch">Документы</text>
      <rect x="227" y="196" width="94" height="26" rx="13" fill="#00B4A6" fill-opacity="0.08" stroke="#00B4A6" stroke-opacity="0.45"/><text x="274.0" y="213.5" text-anchor="middle" class="ch">Аналитика</text>
      <rect x="331" y="196" width="56" height="26" rx="13" fill="#00B4A6" fill-opacity="0.08" stroke="#00B4A6" stroke-opacity="0.45"/><text x="359.0" y="213.5" text-anchor="middle" class="ch">Роли</text>
    </g>
    <rect x="0.75" y="0.75" width="588.5" height="248.5" rx="20" fill="none" stroke="url(#teal)" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
</svg>
