<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24">
  <defs>
    <linearGradient id="l" x1="0" x2="1">
      <stop offset="0" stop-color="#0097B2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B4A6"/>
      <stop offset="1" stop-color="#0097B2" stop-opacity="0"/>
